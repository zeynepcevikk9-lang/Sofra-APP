openapi: 3.0.3
info:
  title: Sofra API
  version: 1.0.0
  description: >-
    Sofra'nın dolap, öneri, plan, alışveriş ve izin sınırlarını tanımlayan ilk
    teknoloji bağımsız API sözleşmesi. Gerçek AI, sağlık ve market sağlayıcıları
    bu sözleşmenin arkasına daha sonra bağlanır.
servers:
  - url: https://api.sofra.example.com
    description: Placeholder; gerçek ortam adresi daha sonra belirlenecek.
tags:
  - name: User
  - name: Pantry
  - name: Recommendations
  - name: Plans
  - name: Shopping
  - name: Market
  - name: Share
  - name: Sync
paths:
  /v1/me:
    get:
      tags: [User]
      summary: Kullanıcı ve izin özetini getirir
      operationId: getMe
      responses:
        '200':
          description: Kullanıcı özeti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /v1/me/export:
    get:
      tags: [User]
      summary: Kullanıcının Sofra verilerini dışa aktarır
      operationId: exportMyData
      responses:
        '200':
          description: Makine tarafından okunabilir veri dışa aktarımı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExport'
  /v1/share/preview:
    post:
      tags: [Share]
      summary: Tarif veya plani private verileri ayiklayarak paylasim onizlemesine cevirir
      operationId: previewShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePreviewRequest'
      responses:
        '200':
          description: Kalici link olusturmayan public projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/auth/status:
    get:
      tags: [User]
      summary: Anonim oturum ve hesap bağlama sınırını getirir
      operationId: getAuthStatus
      responses:
        '200':
          description: OAuth bağlı değil; gerçek hesap akışı daha sonra açılacak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /v1/sync/status:
    get:
      tags: [Sync]
      summary: Hesap bagli olmadan senkronizasyon sinirini getirir
      operationId: getSyncStatus
      responses:
        '200':
          description: Bulut/cihazlar arasi senkron kapali durum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
  /v1/sync/prepare:
    post:
      tags: [Sync]
      summary: Acik onay varsa cihaz verisinin surumlu sync projection'ini hazirlar
      operationId: prepareSync
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPrepareRequest'
      responses:
        '200':
          description: Buluta gonderilmeyen, persistence yapmayan sync envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/notifications/status:
    get:
      tags: [User]
      summary: Bildirim izin planını ve kanal sınırını getirir
      operationId: getNotificationStatus
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [ios, android, web]
            default: web
      responses:
        '200':
          description: Sistem bildirimi henüz istenmedi; uygulama yalnızca izin planını döndürür
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/billing/status:
    get:
      tags: [User]
      summary: Ücretsiz plan ve Sofra Plus durumunu getirir
      operationId: getBillingStatus
      responses:
        '200':
          description: Ödeme bağlı değildir; checkout açılmaz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
  /v1/recipes:
    get:
      tags: [Recommendations]
      summary: Tarif kataloğunu mod, arama ve süreyle listeler
      operationId: listRecipes
      parameters:
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [sofra, fit, tatli], default: sofra }
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: max_minutes
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 240 }
      responses:
        '200':
          description: Filtrelenmiş tarif kataloğu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeCatalogResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/recipes/{recipeId}:
    get:
      tags: [Recommendations]
      summary: Tek tarifin güvenlik ve besin doğrulama görünümünü getirir
      operationId: getRecipe
      parameters:
        - $ref: '#/components/parameters/RecipeId'
        - name: servings
          in: query
          required: false
          description: Tarif detayindaki miktarlari istenen kisi sayisina gore olceklendirir
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Tarif detay görünümü
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/recipe-sources/validate:
    post:
      tags: [Recommendations]
      summary: Tarif kaynak kaydini lisans, atif ve medya sinirlarina gore dogrular
      operationId: validateRecipeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeSourceRecordInput'
      responses:
        '200':
          description: Kaynak kaydi dogrulama sonucu; bu endpoint kayit yapmaz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSourceValidation'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/ai/status:
    get:
      tags: [Recommendations]
      summary: AI sağlayıcısı ve güvenli fallback durumunu getirir
      operationId: getAiStatus
      responses:
        '200':
          description: AI sözleşme durumu; canlı model bağlı değilse deterministik fallback kullanılır
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiStatus'
  /v1/health/permission-plan:
    get:
      tags: [Recommendations]
      summary: HealthKit veya Health Connect izin planını getirir
      operationId: getHealthPermissionPlan
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [apple_healthkit, health_connect]
      responses:
        '200':
          description: Salt okunur, henüz canlı bağlantı kurmayan izin planı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthPermissionPlan'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/health/adapter-status:
    get:
      tags: [Recommendations]
      summary: HealthKit veya Health Connect adapter durumunu getirir
      operationId: getHealthAdapterStatus
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [apple_healthkit, health_connect]
      responses:
        '200':
          description: Provider izinleri, baglanti durumu ve manuel Fit fallback bilgisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthAdapterStatus'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/me/data:
    delete:
      tags: [User]
      summary: Kullanıcının Sofra verilerini siler
      operationId: deleteMyData
      description: Gerçek uygulamada kimlik doğrulama ve açık silme onayı gerekir.
      responses:
        '204':
          description: Sofra verileri silindi
  /v1/pantry:
    get:
      tags: [Pantry]
      summary: Kullanıcının dolap kayıtlarını getirir
      operationId: listPantryItems
      responses:
        '200':
          description: Dolap kayıtları
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PantryItem'
  /v1/pantry/parse-note:
    post:
      tags: [Pantry]
      summary: Doğal cümleyi kullanıcı onayına sunulacak ürünlere ayırır
      operationId: parsePantryNote
      description: Sonuç kullanıcı açıkça onaylamadan dolap kaydına yazılmaz.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryNoteParseRequest'
      responses:
        '200':
          description: Ayrıştırma önizlemesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryNoteParseResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/pantry/items:
    post:
      tags: [Pantry]
      summary: Kullanıcı onaylı ürün ekler
      operationId: createPantryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryItemInput'
      responses:
        '201':
          description: Oluşturulan kayıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/pantry/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [Pantry]
      summary: Miktar, durum veya tarihi günceller
      operationId: updatePantryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryItemPatch'
      responses:
        '200':
          description: Güncellenen kayıt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pantry]
      summary: Dolap kaydını kaldırır
      operationId: deletePantryItem
      responses:
        '204':
          description: Kayıt kaldırıldı
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/pantry/items/bulk:
    post:
      tags: [Pantry]
      summary: Kullanıcı onaylı ürünleri atomik toplu kaydeder
      operationId: createPantryItemsBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PantryItemsBulkInput'
      responses:
        '201':
          description: Oluşturulan toplu kayıtlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PantryItemsBulkResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/recommendations:
    post:
      tags: [Recommendations]
      summary: Açıklanabilir öneri üretir
      operationId: createRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Öneri sonucu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/recommendations/{recommendationId}/feedback:
    parameters:
      - name: recommendationId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Recommendations]
      summary: Öneri geri bildirimini kaydeder
      operationId: createRecommendationFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                  enum: [helpful, not_helpful]
      responses:
        '204':
          description: Geri bildirim kaydedildi
  /v1/plans:
    get:
      tags: [Plans]
      summary: Hafta, ay ve geçmiş planlarını getirir
      operationId: listPlans
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [week, month, history]
            default: week
      responses:
        '200':
          description: Plan görünümü
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
    post:
      tags: [Plans]
      summary: Menüyü plana ekler
      operationId: createPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '201':
          description: Oluşturulan plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
  /v1/shopping/candidates:
    get:
      tags: [Shopping]
      summary: Planlardan alışveriş adaylarını çıkarır
      operationId: listShoppingCandidates
      responses:
        '200':
          description: Alışveriş adayları
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingCandidate'
  /v1/market/quotes:
    post:
      tags: [Market]
      summary: Onaylanmış liste için market tekliflerini ister
      operationId: createMarketQuotes
      description: Kullanıcı listesi açıkça onaylanmadan canlı veya partner fiyatı istenmez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateIds, userConfirmed, sort]
              properties:
                candidateIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                userConfirmed:
                  type: boolean
                  description: true olmadan teklif alınmaz.
                sort:
                  type: string
                  enum: [total, fast, single]
                  description: Teklif sıralaması; fiyat etiketi yalnızca karşılaştırılabilir toplamda kullanılır.
      responses:
        '200':
          description: Market teklifleri
          content:
            application/json:
              schema:
                type: object
                required: [market_status, quotes, sort]
                properties:
                  market_status:
                    type: string
                    enum: [demo_only, live]
                    description: Prototipte demo_only; canlı adaptörler bağlandığında live olur.
                  quotes:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketQuote'
                  sort: { type: string, enum: [total, fast, single] }
        '409':
          description: Kullanıcı listesi onaylanmadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/market/handoff:
    post:
      tags: [Market]
      summary: Onaylanmış liste için partner yönlendirme niyeti oluşturur
      operationId: createMarketHandoff
      description: Prototipte dış URL açmaz; canlı partner bağlantısı bağlandığında aynı sözleşme kullanılabilir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, candidateIds, userConfirmed]
              properties:
                provider:
                  type: string
                  enum: [CarrefourSA, Getir, Migros]
                candidateIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string }
                userConfirmed: { type: boolean }
      responses:
        '200':
          description: Demo yönlendirme niyeti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHandoff'
        '409':
          description: Kullanıcı listesi onaylanmadı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Kayıt bulunamadı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Girdi doğrulanamadı
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      required: [id, auth_provider, locale, created_at]
      properties:
        id: { type: string }
        auth_provider:
          type: string
          enum: [google, apple, anonymous]
        locale: { type: string, example: tr-TR }
        created_at: { type: string, format: date-time }
    AuthStatus:
      type: object
      required: [schema_version, session, account_linking, anonymous_usage, providers, data_rights]
      properties:
        schema_version: { type: integer, example: 1 }
        session:
          type: object
          required: [user_id, provider, status]
          properties:
            user_id: { type: string }
            provider: { type: string, enum: [anonymous, google, apple] }
            status: { type: string, enum: [anonymous, not_connected] }
        account_linking:
          type: object
          required: [available, requires_external_oauth, token_storage, confirmation_required, pkce, callback_exchange, redirect_uri_allowlist]
          properties:
            available: { type: boolean }
            requires_external_oauth: { type: boolean }
            token_storage: { type: string, enum: [not_enabled] }
            confirmation_required: { type: boolean }
            pkce: { type: string, enum: [required] }
            callback_exchange: { type: string, enum: [server_only] }
            redirect_uri_allowlist: { type: string, enum: [required] }
        anonymous_usage:
          type: object
          required: [device_only, cloud_sync, cross_device_sync, account_required_for_sync, prototype_usage_limit]
          properties:
            device_only: { type: boolean }
            cloud_sync: { type: boolean }
            cross_device_sync: { type: boolean }
            account_required_for_sync: { type: boolean }
            prototype_usage_limit: { type: string, enum: [not_enforced] }
        providers:
          type: array
          items:
            type: object
            required: [id, status, available]
            properties:
              id: { type: string, enum: [google, apple] }
              status: { type: string, enum: [not_connected] }
              available: { type: boolean }
        data_rights:
          type: object
          required: [export_endpoint, delete_endpoint]
          properties:
            export_endpoint: { type: string }
            delete_endpoint: { type: string }
    NotificationStatus:
      type: object
      required: [schema_version, platform, live_permission, permission_status, permission_plan, channels, requires_user_action, privacy]
      properties:
        schema_version: { type: integer, example: 1 }
        platform: { type: string, enum: [ios, android, web] }
        live_permission: { type: boolean }
        permission_status: { type: string, enum: [not_requested, granted, denied] }
        permission_plan:
          type: object
          required: [permission_api, permission_key]
          properties:
            permission_api: { type: string }
            permission_key: { type: string }
        channels:
          type: array
          items:
            type: object
            required: [key, label, default_enabled, enabled]
            properties:
              key: { type: string, enum: [meal_reminder, expiry_reminder, plan_reminder] }
              label: { type: string }
              default_enabled: { type: boolean }
              enabled: { type: boolean }
        requires_user_action: { type: boolean }
        privacy:
          type: object
          required: [content_preview, health_data_included, market_data_included]
          properties:
            content_preview: { type: boolean }
            health_data_included: { type: boolean }
            market_data_included: { type: boolean }
    BillingStatus:
      type: object
      required: [schema_version, current_plan, subscription_status, checkout, plans, entitlements, disclosure]
      properties:
        schema_version: { type: integer, example: 1 }
        current_plan: { type: string, enum: [free, plus] }
        subscription_status: { type: string, enum: [inactive, active, past_due, canceled] }
        checkout:
          type: object
          required: [available, provider, live, confirmation_required]
          properties:
            available: { type: boolean }
            provider: { type: string, enum: [not_connected] }
            live: { type: boolean }
            confirmation_required: { type: boolean }
        plans:
          type: array
          items:
            type: object
            required: [id, label, available, price_display, entitlements]
            properties:
              id: { type: string, enum: [free, plus] }
              label: { type: string }
              available: { type: boolean }
              price_display: { type: string, nullable: true }
              entitlements: { type: array, items: { type: string } }
        entitlements:
          type: object
          additionalProperties: { type: boolean }
        disclosure: { type: string }
    RecipeCatalogResponse:
      type: object
      required: [mode, query, max_minutes, items]
      properties:
        mode: { type: string, enum: [sofra, fit, tatli] }
        query: { type: string }
        max_minutes: { type: integer, nullable: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecipeCatalogItem'
    RecipeCatalogItem:
      type: object
      required: [id, title, minutes, ingredients, tags, fit, fit_goals, fit_verification, nutrition, nutrition_provenance, content_provenance, safety]
      properties:
        id: { type: string }
        title: { type: string }
        minutes: { type: integer, minimum: 0 }
        emoji: { type: string }
        ingredients: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        fit: { type: boolean }
        fit_goals: { type: array, items: { type: string, enum: [balanced, lose, gain] } }
        fit_verification: { type: string, enum: [verified, unverified] }
        nutrition:
          type: object
          nullable: true
          properties:
            kcal: { type: number, minimum: 0 }
            protein_g: { type: number, minimum: 0 }
            carbs_g: { type: number, minimum: 0 }
            fat_g: { type: number, minimum: 0 }
            fiber_g: { type: number, minimum: 0 }
        nutrition_provenance:
          allOf:
            - $ref: '#/components/schemas/NutritionProvenance'
          nullable: true
        content_provenance:
          allOf:
            - $ref: '#/components/schemas/RecipeContentProvenance'
          nullable: true
        recipe_detail:
          allOf:
            - $ref: '#/components/schemas/RecipeDetail'
          nullable: true
        safety:
          type: object
          required: [allergens, verified, cross_contamination]
          properties:
            allergens: { type: array, items: { type: string } }
            verified: { type: boolean }
            cross_contamination: { type: string }
    RecipeDetail:
      allOf:
        - $ref: '#/components/schemas/RecipeCatalogItem'
        - type: object
          required: [source, instructions_available, servings, base_servings, scale_factor, ingredients_detail, ingredient_safety, instructions, step_media, tip]
          properties:
            source: { type: string, enum: [catalog_v1] }
            instructions_available: { type: boolean }
            servings: { type: integer, minimum: 1, nullable: true }
            base_servings: { type: integer, minimum: 1, nullable: true }
            scale_factor: { type: number, minimum: 0 }
            ingredients_detail:
              type: array
              items:
                type: object
                required: [canonical_name, display_name, quantity_text, quantity_value, unit]
                properties:
                  canonical_name: { type: string }
                  display_name: { type: string, nullable: true }
                  quantity_text: { type: string, nullable: true }
